# Alembic config for the ops_* tables only. The legacy bot tables (bookings,
# ai_usage, …) are created by storage/db.py and are invisible to Alembic.
# Database URL: OPS_DATABASE_URL, else sqlite:///<TRAVELDESK_HOME>/<DATABASE_PATH>.
#
#   alembic upgrade head
#   alembic revision --autogenerate -m "..."

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
