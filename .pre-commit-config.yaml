# Install once:  pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
  - repo: local
    hooks:
      - id: no-env-or-db
        name: never commit .env, travellers.json or SQLite files
        entry: "Refusing to commit secrets or local data"
        language: fail
        files: '(^|/)(\.env|travellers\.json)$|\.db(-shm|-wal|-journal)?$'
