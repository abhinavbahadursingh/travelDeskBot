[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "traveldesk"
version = "0.1.0"
description = "Slack bot for employee flight self-booking via LetsFG, with Claude picking the flight."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Ranges cap major versions; exact versions live in requirements.lock.
dependencies = [
    "slack_bolt>=1.21,<2",
    "slack_sdk>=3.33,<4",
    "anthropic>=0.60,<1",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "cryptography>=42,<51",
    # ops layer (traveldesk.ops)
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.4,<3",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff==0.17.5",
    "pre-commit>=4,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"traveldesk.ops" = ["gst_rates.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv*"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, blind-except
select = ["E", "W", "F", "I", "UP", "B", "BLE"]
ignore = [
    "E501",   # long lines: prompts and Slack text; formatter handles code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "BLE001", "F811"]  # F811: fixtures imported from other test modules

[tool.ruff.lint.isort]
known-first-party = ["traveldesk", "tests"]
